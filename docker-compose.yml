services:
  skyclip:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: 8787
      SKYCLIP_DATA_FILE: /data/skyclip-data.json
      SKYCLIP_UPLOAD_DIR: /data/uploads
      SKYCLIP_RENDER_DIR: /data/renders
    volumes:
      - skyclip-data:/data
    restart: unless-stopped

volumes:
  skyclip-data:
